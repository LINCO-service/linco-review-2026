<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>【測試環境】百鮮年度計劃暨會議管理工作台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --ink:#1E2B3A; --paper:#FFFFFF; --mist:#F2F4F6; --line:#D9DEE3; --muted:#5E6B78;
  --saffron:#C98F0A; --saffron-soft:#FBF1D6;
  --gA:#2F6FB2; --gB:#2E8B6A; --gC:#7A55B0; --gX:#1E2B3A;
  --field:#FFFFFF; --danger:#B3261E;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --serif:"Noto Serif TC","PMingLiU",Georgia,serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ink:#E7ECF1; --paper:#141A21; --mist:#1C242D; --line:#2E3945; --muted:#9AA7B4;
    --saffron:#E9B43A; --saffron-soft:#3A2F14; --field:#10151B;
    --gA:#6FA3DD; --gB:#5CBF99; --gC:#AE8BDB; --gX:#E7ECF1;
  }
}
:root[data-theme="dark"]{
  --ink:#E7ECF1; --paper:#141A21; --mist:#1C242D; --line:#2E3945; --muted:#9AA7B4;
  --saffron:#E9B43A; --saffron-soft:#3A2F14; --field:#10151B;
  --gA:#6FA3DD; --gB:#5CBF99; --gC:#AE8BDB; --gX:#E7ECF1;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6}
button,select,textarea,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--saffron);outline-offset:2px}

.wrap{max-width:1280px;margin:0 auto;padding:20px 20px 60px}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.brand h1{font-family:var(--serif);font-weight:900;font-size:clamp(24px,3.2vw,34px);margin:0;line-height:1.2;letter-spacing:.02em}
.brand p{margin:4px 0 0;color:var(--muted);font-size:14px}
.top-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:7px 14px;font-size:14px}
.btn:hover{background:var(--mist)}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.primary:hover{opacity:.9}
.status{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.status i{width:8px;height:8px;border-radius:50%;background:var(--gB);display:inline-block}
.status.busy i{background:var(--saffron)}
.status.local i{background:var(--muted)}

/* timeline */
.timeline{display:flex;gap:0;overflow-x:auto;margin:22px 0 26px;padding-bottom:4px}
.tl-item{flex:1 0 118px;border:none;background:none;text-align:left;padding:10px 12px 12px;border-top:3px solid var(--line);position:relative}
.tl-item .d{font-family:var(--serif);font-size:20px;font-weight:900;line-height:1.1}
.tl-item .n{font-size:12px;color:var(--muted);margin-top:2px}
.tl-item .s{font-size:13px;margin-top:6px;line-height:1.35}
.tl-item:hover{background:var(--mist)}
.tl-item.past{opacity:.62}
.tl-item.today .n::after{content:"今天";white-space:nowrap;display:inline-block;margin-left:6px;background:var(--saffron);color:#fff;padding:0 6px;border-radius:4px;font-size:11px}
.tl-item.active{border-top-color:var(--saffron);background:var(--saffron-soft);opacity:1}
.tl-item.later{cursor:default}
.tl-item.later .d{font-size:16px}

/* meeting layout */
.meeting{display:grid;grid-template-columns:330px minmax(0,1fr);gap:28px;align-items:start}
@media (max-width:900px){.meeting{grid-template-columns:1fr}}
.agenda h2{font-family:var(--serif);font-weight:900;font-size:24px;margin:0;line-height:1.25}
.agenda .when{color:var(--muted);margin:4px 0 16px;font-size:14px}
.agenda ol{list-style:none;margin:0;padding:0;counter-reset:ag}
.agenda li{counter-increment:ag;display:grid;grid-template-columns:28px 1fr auto;gap:4px 8px;padding:10px 0;border-top:1px solid var(--line)}
.agenda li::before{content:counter(ag);font-family:var(--serif);font-weight:900;color:var(--saffron);font-size:18px;line-height:1.4}
.agenda li .t{font-weight:700}
.agenda li .sub{grid-column:2/4;font-size:13px;color:var(--muted);line-height:1.5}
.agenda li .min{font-size:12px;color:var(--muted);white-space:nowrap;padding-top:3px}
.agenda li .jump{grid-column:2/4;display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.agenda li .jump button{border:none;background:var(--mist);border-radius:6px;font-size:12px;padding:2px 8px}
.agenda li .jump button:hover{background:var(--saffron-soft)}
.next{margin-top:14px;padding:12px 14px;background:var(--mist);border-radius:10px;font-size:14px}
.next b{display:block;font-size:12px;color:var(--muted);font-weight:500}
.present{width:100%;margin-top:16px;padding:12px;font-size:15px}

/* forms */
.formtabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.formtab{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 14px;font-size:14px}
.formtab[aria-selected="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.formhead{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:10px}
.formhead h3{margin:0;font-size:19px;font-weight:700}
.formhead p{margin:2px 0 0;color:var(--muted);font-size:14px;max-width:62ch}
.groupsel{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex-shrink:0}
.groupsel button{border:none;background:var(--paper);padding:7px 14px;font-size:14px;display:flex;align-items:center;gap:6px}
.groupsel button+button{border-left:1px solid var(--line)}
.groupsel button .dot{width:9px;height:9px;border-radius:50%}
.groupsel button[aria-pressed="true"]{background:var(--mist);font-weight:700}
.groupsel .fill{font-size:11px;color:var(--muted);font-weight:400}
.members{font-size:13px;color:var(--muted);margin:0 0 12px}
.members b{color:var(--ink);font-weight:500}

.hints{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 12px;font-size:13px}
.hints span.lbl{color:var(--muted)}
.hints span.chip{background:var(--saffron-soft);border-radius:6px;padding:2px 8px}
details.example{margin:0 0 14px;border:1px dashed var(--line);border-radius:10px;padding:8px 12px;font-size:14px}
details.example summary{cursor:pointer;color:var(--muted)}
details.example table{margin-top:8px}

.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table.sheet{border-collapse:collapse;width:100%;min-width:560px}
table.sheet th,table.sheet td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);vertical-align:top;text-align:left}
table.sheet tr>*:last-child{border-right:none}
table.sheet tbody tr:last-child>*{border-bottom:none}
table.sheet thead th{background:var(--mist);font-size:13px;font-weight:700;padding:8px 10px}
table.sheet th.rowh{background:var(--mist);font-size:14px;font-weight:500;padding:10px;white-space:nowrap;width:1%}
table.sheet th.grouph{background:var(--saffron-soft);font-size:13px;font-weight:700;padding:10px 8px;width:1%;writing-mode:vertical-rl;text-orientation:upright;letter-spacing:.1em;text-align:center}
table.sheet td{padding:0;min-width:150px}
table.sheet textarea{display:block;width:100%;min-height:62px;border:none;background:var(--field);padding:8px 10px;resize:vertical;line-height:1.5;font-size:14px}
table.sheet textarea:focus{outline:2px solid var(--saffron);outline-offset:-2px}
table.sheet input.colname{width:100%;border:1px dashed var(--line);background:var(--field);border-radius:6px;padding:3px 6px;font-weight:700;font-size:13px}
table.wide{min-width:1500px}
table.wide td{min-width:120px}
.readonly textarea{pointer-events:none}
.cellro{padding:8px 10px;white-space:pre-wrap;font-size:14px;min-height:40px}

.topfields{display:grid;gap:10px;margin-bottom:12px}
.topfields label{display:grid;grid-template-columns:90px 1fr;gap:10px;align-items:start;font-weight:700;font-size:14px}
.topfields textarea{width:100%;min-height:52px;border:1px solid var(--line);border-radius:8px;background:var(--field);padding:8px 10px;resize:vertical}

/* S/W items */
.swsec{margin-bottom:18px}
.swsec h4{margin:0 0 8px;font-size:16px;display:flex;align-items:center;gap:8px}
.swsec h4 .tag{font-family:var(--serif);font-weight:900;background:var(--ink);color:var(--paper);border-radius:6px;padding:0 8px}
.item{display:grid;grid-template-columns:1fr auto auto auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.item textarea{width:100%;min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--field);padding:6px 10px;resize:vertical}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;font-size:13px}
.seg span{padding:0 8px;color:var(--muted);align-self:center;font-size:12px}
.seg button{border:none;background:var(--paper);padding:5px 9px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.del{border:none;background:none;color:var(--muted);font-size:18px;line-height:1;padding:4px 8px}
.del:hover{color:var(--danger)}
.add{border:1px dashed var(--line);background:none;border-radius:8px;padding:7px 14px;margin-top:6px;font-size:14px;color:var(--muted)}
.add:hover{color:var(--ink);border-color:var(--ink)}
@media (max-width:640px){.item{grid-template-columns:1fr auto}.item textarea{grid-column:1/3}}

/* roles */
.leader{display:flex;gap:10px;align-items:center;margin-bottom:12px;font-weight:700}
select{border:1px solid var(--line);border-radius:8px;background:var(--field);padding:6px 10px;min-width:130px}
table.sheet td.sel{padding:6px 10px}

/* roster overlay */
.dialog{position:fixed;inset:0;background:rgba(10,15,20,.5);display:none;align-items:center;justify-content:center;padding:20px;z-index:40}
.dialog.open{display:flex}
.dialog .card{background:var(--paper);border-radius:14px;max-width:960px;width:100%;max-height:90%;overflow:auto;padding:22px}
.dialog h2{margin:0 0 14px;font-family:var(--serif);font-weight:900}
.roster{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px}
.roster h3{margin:0 0 6px;display:flex;align-items:center;gap:8px}
.roster ul{list-style:none;margin:0;padding:0;font-size:14px}
.roster li{padding:5px 0;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:8px}
.roster li small{color:var(--muted)}
.roster .lead{color:var(--saffron);font-weight:700;font-size:12px}

/* ===== presentation ===== */
.deck{position:fixed;inset:0;background:#16202B;color:#F3F5F7;display:none;z-index:50;flex-direction:column;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
.deck.open{display:flex}
.deck .stage{flex:1;display:flex;align-items:center;justify-content:center;padding:3vh 4vw;overflow:hidden}
.slide{width:100%;height:100%;max-width:1400px;display:flex;flex-direction:column;justify-content:center;overflow:auto}
.deck .bar{display:flex;align-items:center;justify-content:space-between;padding:10px 18px;font-size:14px;color:#9FB0C0}
.deck .bar button{background:none;border:1px solid #3A4A5A;color:#E7ECF1;border-radius:8px;padding:6px 14px}
.deck .bar button:hover{background:#23303D}
.slide .kicker{color:#E9B43A;font-size:clamp(14px,1.6vw,22px);margin-bottom:1vh}
.slide h1{font-family:var(--serif);font-weight:900;font-size:clamp(34px,6vw,86px);line-height:1.15;margin:0}
.slide h2{font-family:var(--serif);font-weight:900;font-size:clamp(28px,3.8vw,56px);line-height:1.2;margin:0 0 3vh}
.slide p.lead{font-size:clamp(16px,2vw,28px);color:#C6D1DC;margin:2vh 0 0;max-width:40em}
.slide ol.flow{list-style:none;padding:0;margin:0;counter-reset:f;font-size:clamp(18px,2.4vw,34px)}
.slide ol.flow li{counter-increment:f;display:flex;gap:1.2em;padding:.5em 0;border-top:1px solid #2E3D4C;align-items:baseline}
.slide ol.flow li::before{content:counter(f);color:#E9B43A;font-family:var(--serif);font-weight:900;min-width:1.2em}
.slide ol.flow li small{color:#9FB0C0;font-size:.6em;margin-left:auto;white-space:nowrap}
.slide .timer{font-family:var(--serif);font-weight:900;font-size:clamp(90px,20vw,280px);line-height:1;color:#E9B43A;font-variant-numeric:tabular-nums;margin:2vh 0}
.slide .timer.over{color:#FF7A6B}
.slide .tctl{display:flex;gap:10px;flex-wrap:wrap}
.slide .tctl button{background:#23303D;border:1px solid #3A4A5A;color:#F3F5F7;border-radius:10px;padding:10px 20px;font-size:clamp(14px,1.5vw,20px)}
.slide .tctl button.go{background:#E9B43A;color:#16202B;border-color:#E9B43A;font-weight:700}
.slide .chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:3vh}
.slide .chips span{border:1px solid #3A4A5A;border-radius:8px;padding:6px 14px;font-size:clamp(14px,1.6vw,22px)}
.slide .road{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:2vh 1.5vw}
.slide .road div{border-top:3px solid #3A4A5A;padding-top:10px}
.slide .road div.hl{border-top-color:#E9B43A}
.slide .road b{display:block;font-family:var(--serif);font-size:clamp(18px,2vw,28px)}
.slide .road span{color:#C6D1DC;font-size:clamp(13px,1.3vw,18px)}
.slide .rgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:2vw;font-size:clamp(14px,1.5vw,20px)}
.slide .rgrid h3{margin:0 0 1vh;font-size:1.3em}
.slide .rgrid div div{padding:4px 0;border-top:1px solid #2E3D4C}
.slide .rep-tabs{display:flex;gap:8px;margin-bottom:2vh;flex-wrap:wrap}
.slide .rep-tabs button{background:#23303D;border:1px solid #3A4A5A;color:#F3F5F7;border-radius:999px;padding:6px 18px;font-size:clamp(14px,1.4vw,19px)}
.slide .rep-tabs button[aria-pressed="true"]{background:#E9B43A;color:#16202B;border-color:#E9B43A;font-weight:700}
.slide .rep{overflow:auto;max-height:66vh;background:#F7F8FA;color:#1E2B3A;border-radius:10px}
.slide .rep table.sheet{font-size:clamp(13px,1.2vw,17px)}
.slide .rep table.sheet thead th,.slide .rep table.sheet th.rowh{background:#E6EAEE}
.slide .rep table.sheet th.grouph{background:#FBF1D6}
.slide .rep .swro{padding:12px 16px}
.slide .rep .swro h4{margin:6px 0}
.slide .rep .swro div{padding:4px 0;border-top:1px solid #D9DEE3;display:flex;justify-content:space-between;gap:12px}
.slide .rep .swro small{color:#5E6B78;white-space:nowrap}
.slide .rep .cellro{color:#1E2B3A}
@media (prefers-reduced-motion:no-preference){.slide{animation:in .25s ease-out}@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}}

.slide .rolesall{display:grid;grid-template-columns:repeat(3,1fr);gap:2vw;font-size:clamp(14px,1.4vw,19px)}
.slide .rolesall h3{margin:0 0 1vh;font-size:1.3em}
.slide .rrow{display:grid;grid-template-columns:4.2em 1fr 1fr;gap:8px;align-items:center;padding:5px 0;border-top:1px solid #2E3D4C}
.slide .rrow.hd{color:#9FB0C0;border-top:none}
.slide .rlead{display:grid;grid-template-columns:4.2em 1fr;gap:8px;align-items:center;margin-bottom:6px;font-weight:700}
.slide select{background:#23303D;color:#F3F5F7;border:1px solid #3A4A5A;min-width:0;width:100%;font-size:inherit;padding:6px 8px}
.slide .rolehead{display:flex;justify-content:space-between;align-items:flex-start;gap:3vw;margin-bottom:2vh}
.slide .qr{display:flex;gap:14px;align-items:center;font-size:clamp(12px,1.1vw,15px);color:#C6D1DC;max-width:24em}
.slide .qr .code{background:#fff;padding:8px;border-radius:8px;line-height:0}
.slide .draw{margin-top:3vh;padding:2vh 2vw;border:1px dashed #3A4A5A;border-radius:12px;display:flex;flex-wrap:wrap;gap:2vw;align-items:center;font-size:clamp(16px,1.8vw,26px)}
.slide .draw .who{display:flex;gap:2vw;flex-wrap:wrap}
.slide .draw .who span b{color:#E9B43A;margin-left:.4em;font-family:var(--serif)}
.slide .drawn{color:#E9B43A}
.slide .smallbtn{align-self:flex-start;background:none;border:1px solid #3A4A5A;color:#9FB0C0;border-radius:8px;padding:4px 12px;font-size:13px;margin-top:2vh}
.slide .ex{background:#F7F8FA;color:#1E2B3A;border-radius:10px;overflow:auto;max-height:46vh;margin-top:3vh}
.slide .ex table.sheet{font-size:clamp(12px,1.1vw,16px);min-width:0}
.slide .ex table.sheet thead th,.slide .ex table.sheet th.rowh{background:#E6EAEE}
.slide .ex .cap{padding:8px 12px;font-size:13px;color:#5E6B78}
@media (max-width:800px){.slide .rolesall{grid-template-columns:1fr}}
table.sheet.att td{min-width:44px}
table.board tr.armed:hover td,table.board tr.hot td{background:var(--saffron-soft)}
.pool.armed{outline:1px dashed var(--saffron)}
.pool.hot{background:var(--saffron-soft)}
#dBadges{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:14px;display:flex;gap:10px;align-items:flex-start;z-index:55}
#dBadges .bdg{display:flex;align-items:center;gap:10px;background:rgba(30,43,56,.92);border:1px solid #3A4A5A;color:#F3F5F7;border-radius:12px;padding:8px 12px;font-family:var(--sans)}
#dBadges button.bdg{cursor:pointer;font-size:14px}
#dBadges .bdg b{font-family:var(--serif);font-size:26px;color:#E9B43A;letter-spacing:.06em;line-height:1}
#dBadges .bdg small{display:block;color:#9FB0C0;font-size:11px;line-height:1.3}
#dBadges .bdg.code div{display:flex;flex-direction:column;align-items:flex-start}
#dBadges .bdg.warn b{color:#FFB84D}
#dBadges .bdg.over{border-color:#FF7A6B;animation:blink 1s steps(2) infinite}
#dBadges .bdg.over b{color:#FF7A6B}
#dBadges .bqr{background:#fff;padding:4px;border-radius:6px;line-height:0}
@keyframes blink{50%{background:rgba(179,38,30,.6)}}
#dCodeBtn[aria-pressed="true"]{background:#E9B43A!important;color:#16202B!important;border-color:#E9B43A!important}
.slide .cloud{display:flex;flex-wrap:wrap;justify-content:center;align-content:center;gap:2vh 3vw;min-height:62vh;padding:2vh 2vw}
.slide .cloud .cw{display:inline-block;line-height:1.3;animation:floaty 6s ease-in-out infinite alternate;text-shadow:0 2px 12px rgba(0,0,0,.35)}
@keyframes floaty{0%{transform:translate(0,0)}50%{transform:translate(6px,-14px)}100%{transform:translate(-6px,8px)}}
@media (prefers-reduced-motion:reduce){.slide .cloud .cw{animation:none}}
/* 年度計劃表單 */
input.num{width:84px;border:1px solid var(--line);border-radius:6px;padding:4px 6px;text-align:right;background:var(--field);font-variant-numeric:tabular-nums}
.pin{width:100%;border:1px solid var(--line);border-radius:6px;padding:5px 8px;background:var(--field)}
textarea.pin{resize:vertical;min-height:52px}
table.plan{min-width:0;font-size:13px}
table.plan td{min-width:0;padding:4px 6px;vertical-align:middle}
table.plan th{white-space:nowrap}
table.plan td.qt{text-align:right;font-variant-numeric:tabular-nums;background:rgba(201,143,10,.07);white-space:nowrap}
table.plan tr.tot td,table.plan tr.tot th{font-weight:700;background:var(--mist)}
table.plan.big{font-size:clamp(13px,1.2vw,17px)}
td.gantt{padding:0!important;min-width:22px!important}
td.gantt.on{background:#C98F0A}
.pcard{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--paper)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px 12px;margin-top:8px}
.pgrid label{display:grid;gap:3px;font-size:12px;font-weight:700;color:var(--muted)}
.pgrid label.full{grid-column:1/-1}
.mchip{width:30px;height:26px;border:1px solid var(--line);border-radius:6px;background:var(--paper);font-size:12px;display:inline-flex;align-items:center;justify-content:center;color:var(--ink)}
.mchip.on{background:#C98F0A;color:#fff;border-color:#C98F0A}
.calitem{background:var(--mist);border-radius:4px;padding:1px 4px;margin:2px 0;line-height:1.35}
.slide .light .pcard{background:#fff}
/* ===== v5 ===== */
.slide .light table.sheet thead th,.slide .light table.sheet th.rowh,.slide .light table.sheet th,.slide .rep table.sheet th{background:#E6EAEE!important;color:#1E2B3A!important}
.slide .light,.slide .light td,.slide .light .cellro,.slide .light label,.slide .light span,.slide .light div{color:#1E2B3A}
.slide .light table.sheet td,.slide .light table.sheet th{border-color:#D9DEE3}
.slide .light td.qt{background:#FBF6E9!important}
.slide .light tr.tot td,.slide .light tr.tot th{background:#EEF1F4!important}
.slide .light .refbox{border-color:#C9D1D9}
.sched{display:grid;gap:0;font-size:clamp(15px,1.75vw,24px)}
.sched.dense{font-size:clamp(13px,1.35vw,19px)}
.sched.dense .srow{padding:.3em 0}
.slide{justify-content:safe center!important}
.sched .srow{display:grid;grid-template-columns:4.2em 1fr auto;gap:1em;padding:.42em 0;border-top:1px solid #2E3D4C;align-items:baseline}
.sched .st{color:#E9B43A;font-family:var(--serif);font-weight:900;font-variant-numeric:tabular-nums}
.sched .sd{color:#9FB0C0;font-size:.8em;white-space:nowrap}
.gfbox{background:#1E2B38;border-left:6px solid #E9B43A;border-radius:10px;padding:2vh 2vw}
.gflab{color:#E9B43A;font-size:clamp(14px,1.4vw,20px);margin-bottom:.6vh}
.gftxt{font-size:clamp(20px,2.6vw,38px);font-weight:700;white-space:pre-wrap;line-height:1.4}
#dNav{position:fixed;inset:6vh 8vw;background:#1E2B38;border:1px solid #3A4A5A;border-radius:14px;z-index:80;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.5)}
#dNav .navhead{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid #3A4A5A;color:#F3F5F7}
#dNav .navhead button{background:none;border:1px solid #3A4A5A;color:#E7ECF1;border-radius:8px;padding:4px 12px}
#dNav .navlist{overflow:auto;padding:10px;display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:6px}
#dNav .navit{display:flex;gap:10px;align-items:center;text-align:left;background:#16202B;border:1px solid #2E3D4C;color:#E7ECF1;border-radius:8px;padding:8px 10px;font-size:14px}
#dNav .navit:hover{border-color:#E9B43A}
#dNav .navit.cur{background:#E9B43A;color:#16202B;font-weight:700}
#dNav .ni{min-width:2em;color:#9FB0C0;font-variant-numeric:tabular-nums}
#dNav .navit.cur .ni{color:#16202B}
.mcal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.mcal .mh{text-align:center;font-size:12px;color:var(--muted);padding:4px 0}
.mcal .md{min-height:92px;border:1px solid var(--line);border-radius:6px;padding:3px 4px;cursor:pointer;background:var(--paper);overflow:hidden}
.mcal .md:hover{border-color:var(--saffron)}
.mcal .md.empty{border:none;background:none;cursor:default}
.mcal .md.off{background:var(--mist)}
.mcal .dn{font-size:12px;font-weight:700;display:flex;gap:4px;align-items:baseline;flex-wrap:wrap}
.mcal .hol{color:var(--danger);font-weight:400;font-size:11px}
.mcal .ev{font-size:11px;border-left:3px solid;padding:1px 4px;margin-top:2px;background:rgba(127,127,127,.08);border-radius:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pgl{display:grid;gap:4px;font-size:13px;font-weight:700}
table.ops td.opscell{vertical-align:top;min-width:150px;height:56px;cursor:copy}
table.ops td.opscell.hot{background:var(--saffron-soft)}
.opsitem{font-size:12px;background:var(--mist);border-radius:4px;padding:2px 4px;margin:2px 0;display:flex;justify-content:space-between;gap:4px}
.opsitem.proj{border-left:3px solid #C98F0A}
.opsitem .x{border:none;background:none;color:var(--muted);padding:0 2px}
.slide .light .opsitem{background:#EEF1F4}
td.chg,.slide .light td.chg{background:#FFF3C4!important;box-shadow:inset 0 0 0 2px #E9B43A}
tr.newrow td,.slide .light tr.newrow td{background:#E7F6EE!important}
td.chgm.gantt.on{background:#E9B43A!important}
tr.newrow td.gantt.on{background:#C98F0A!important}
.badge{display:inline-block;margin-left:6px;background:#2E8B6A;color:#fff!important;border-radius:4px;padding:0 6px;font-size:.75em}
.chgrow{background:#fff;border-radius:8px;padding:6px 10px;font-size:clamp(13px,1.3vw,18px);display:flex;flex-wrap:wrap;gap:4px;align-items:baseline}
.mgrid{display:grid}
.mgrid .mv{padding:6px 8px;border-right:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
.mgrid .mv:last-child{border-right:none}
thead .mgrid .mv{text-align:left}
.bgrid{display:grid;position:relative;min-height:36px;gap:3px 0;padding:3px 0}
.bzone{border-right:1px dashed rgba(127,127,127,.35);cursor:copy}
.bzone.hot{background:rgba(233,180,58,.3)}
.bar{margin:0 3px;border-radius:6px;color:#fff;font-size:12px;padding:4px 6px;display:flex;justify-content:space-between;align-items:center;gap:4px;z-index:1;cursor:grab;box-shadow:0 1px 2px rgba(0,0,0,.2);min-width:0}
.bar.sel{outline:3px solid #E9B43A}
.bar .bt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#fff!important}
.bar .bctl{display:flex;gap:2px;flex-shrink:0}
.bar .bctl button{border:none;background:rgba(255,255,255,.25);color:#fff;border-radius:4px;padding:0 5px;font-size:12px;line-height:18px}
.slide .light .bar,.slide .light .bar span{color:#fff}
/* ===== v6 操盤表 ===== */
.opswrap{border:1px solid var(--line);border-radius:10px;overflow:auto;background:var(--paper)}
.opsgrid{display:grid;border-top:1px solid var(--line);min-width:640px}
.opsgrid.ophead{border-top:none;background:var(--mist);font-weight:700;font-size:13px}
.opsgrid .oplab{padding:6px 10px;font-size:13px;background:var(--mist);border-right:1px solid var(--line);display:flex;flex-direction:column;justify-content:center}
.opsgrid .oplab small{font-size:11px;color:var(--muted);font-weight:400}
.opsgrid .opm{padding:6px 10px;border-right:1px solid var(--line)}
.opsgrid .opv{padding:5px 10px;text-align:right;border-right:1px solid var(--line);font-variant-numeric:tabular-nums;background:rgba(201,143,10,.07);font-size:13px}
.opmetric .oplab{font-weight:500}
.oprow{position:relative}
.oprow .opcell{border-right:1px solid var(--line);min-height:34px;cursor:copy}
.oprow .opcell.hot{background:var(--saffron-soft)}
.opblk{position:relative;z-index:1;margin:3px 4px;border-left:5px solid;border-radius:6px;padding:3px 6px;font-size:12px;display:flex;justify-content:space-between;align-items:center;gap:4px;color:#1E2B3A;cursor:grab;box-shadow:0 1px 2px rgba(0,0,0,.12);min-width:0}
.opblk.free{border-style:dashed;border-left-style:solid}
.opblk .bt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.opblk .bctl{display:none;gap:1px;flex-shrink:0}
.opblk:hover .bctl,.opblk:focus-within .bctl{display:flex}
.opblk .bctl button{border:none;background:rgba(255,255,255,.7);border-radius:3px;padding:0 4px;font-size:11px;color:#1E2B3A}
@media (hover:none){.opblk .bctl{display:flex}}
.slide .light .opswrap{background:#fff}
.slide .light .opsgrid .oplab,.slide .light .opsgrid.ophead{background:#E6EAEE}
.slide .light .opblk{font-size:clamp(12px,1.1vw,15px)}
#dBadges .bdg.mini{padding:4px 10px;opacity:.85}
#dBadges .bdg.mini b{font-size:18px}
.sched.tiny{font-size:clamp(12px,1.12vw,16px)}
.sched.tiny .srow{padding:.22em 0}
/* 簡報內淺色區塊一律使用淺色主題變數，避免深色模式下看不到內容 */
.slide .light,.slide .rep,.slide .ex{--ink:#1E2B3A;--paper:#FFFFFF;--mist:#F2F4F6;--line:#D9DEE3;--muted:#5E6B78;--field:#FFFFFF;--saffron:#C98F0A;--saffron-soft:#FBF1D6;color:#1E2B3A}
.slide .light .formtab{background:#fff;color:#1E2B3A;border-color:#D9DEE3}
.slide .light .formtab[aria-selected="true"]{background:#1E2B3A;color:#fff}
.slide .light .btn{background:#fff;color:#1E2B3A;border-color:#D9DEE3}
tr.cum td,tr.cum th{background:#EEF6F1!important}
#dBadges .bdg.rs{padding:4px 8px;font-size:14px}
/* 管理月會 */
.lt{display:inline-flex;align-items:center;justify-content:center;min-width:28px;height:24px;border-radius:12px;color:#fff;font-size:12px;border:2px solid transparent;opacity:.45;padding:0 6px}
button.lt{cursor:pointer}
.lt.on,span.lt{opacity:1}
.lt.on{border-color:#1E2B3A}
table.plan td.cur{background:#FFF3C4!important}
/* V2.1 分頁（類似瀏覽器分頁） */
.apptabs{display:flex;flex-wrap:wrap;gap:2px;align-items:flex-end;border-bottom:1px solid var(--line);margin:12px 0 14px;padding:4px 4px 0;overflow:visible}
.apptab{display:flex;align-items:center;gap:8px;min-width:120px;padding:10px 18px;margin-bottom:-1px;border:1px solid var(--line);border-bottom:none;border-radius:12px 12px 0 0;background:var(--mist);color:var(--muted);font-size:15px;cursor:pointer;white-space:nowrap;line-height:1.2}
.apptab .ic{font-size:17px}
.apptab:hover{color:var(--ink)}
.apptab[aria-selected="true"]{background:var(--paper);color:var(--ink);font-weight:700;border-color:var(--line);box-shadow:0 -2px 0 var(--saffron) inset}
ol.pts{margin:4px 0 8px;padding-left:1.6em;line-height:1.7}
.trk{display:inline-block;margin-left:8px;background:#FFF3C4;color:#7A5A00;border-radius:4px;padding:0 6px;font-size:12px}
.recbox{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:6px 0}
.btn.rec-on{background:#C0392B;color:#fff;border-color:#C0392B}
details.livepanel{border:1px solid var(--saffron);background:var(--saffron-soft);border-radius:10px;padding:8px 12px;margin-top:8px}
details.livepanel summary{cursor:pointer;font-weight:700}
@media (max-width:640px){.apptabs{flex-wrap:nowrap;gap:2px;padding:4px 0 0}.apptab{flex:1 1 0;min-width:0;justify-content:center;padding:9px 4px;font-size:14px;gap:4px}.apptab .ic{font-size:15px}}
.calbtn{margin-left:auto;align-self:center;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:6px 14px;font-size:14px;cursor:pointer;white-space:nowrap}
.calbtn:hover{border-color:var(--saffron)}
@media (max-width:640px){.calbtn{padding:6px 8px;font-size:13px}}
.timeline.mtl{margin:12px 0 16px}
.timeline.mtl .tl-item{flex:1 1 0;min-width:64px}
@media (max-width:640px){.timeline.mtl{flex-wrap:wrap;gap:4px;overflow:visible}.timeline.mtl .tl-item{flex:0 0 calc(25% - 3px);min-width:0;padding:6px 6px;border:1px solid var(--line);border-radius:8px}.timeline.mtl .tl-item .s{display:none}.timeline.mtl .tl-item .d{font-size:16px}.timeline.mtl .tl-item .n{font-size:11px}}
.mmsub{display:inline-block;margin-left:10px;font-size:.5em;vertical-align:middle;background:var(--saffron-soft);color:var(--saffron);border:1px solid var(--saffron);border-radius:999px;padding:2px 12px;font-family:var(--sans);font-weight:700}
.mcal .ev.multi{background:var(--saffron-soft);font-weight:700}
.aibar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;border:1px solid var(--saffron);background:var(--saffron-soft);border-radius:10px;padding:8px 12px;margin:8px 0}
.linebox{border:1px solid #06C755;background:rgba(6,199,85,.06);border-radius:10px;padding:10px 12px;margin:8px 0;display:grid;gap:8px}
.btn.line{background:#06C755;color:#fff;border-color:#06C755}
.stat3{display:flex;gap:6px}.stat3 span{flex:1;text-align:center;border-radius:8px;padding:4px 0;font-size:12px;background:var(--mist)}.stat3 b{display:block;font-size:18px}
.stat3 .ok,.linebox .ok{color:#0A8F45}.stat3 .lv,.linebox .lv{color:#C98F0A}.stat3 .no,.linebox .no{color:#C0392B}
details.linebox>summary{cursor:pointer;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.lsum{font-size:13px;color:var(--muted)}
.empty{padding:30px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 16px;border-radius:8px;font-size:14px;display:none;z-index:60}

/* ===== v3 additions ===== */
.agenda li.dayhead{display:block;border-top:none;padding:16px 0 4px;font-family:var(--serif);font-weight:900;color:var(--saffron);font-size:16px}
.agenda li.dayhead::before{content:none}
.agenda li.dayhead{counter-increment:none}
.agenda ol{counter-reset:ag}
.agenda li.dayhead+li{counter-reset:none}
.checkbar{margin-top:12px;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px;padding:10px 14px;border:1px solid var(--line);border-radius:10px}
.checkbar b{font-size:18px;font-family:var(--serif)}

/* participant view */
.pwrap{max-width:980px;margin:0 auto;padding:18px 16px 60px}
.phead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;padding-bottom:12px;border-bottom:1px solid var(--line)}
.phead .org{font-size:13px;color:var(--muted)}
.phead h1{font-family:var(--serif);font-weight:900;font-size:clamp(22px,5vw,30px);margin:2px 0 0;line-height:1.25}
.phead .dt{color:var(--muted);font-size:14px}
.meCard{margin:14px 0;padding:14px 16px;border-radius:12px;background:var(--mist);display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between}
.meCard .who{font-size:17px;font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.meCard .ok{color:var(--gB);font-weight:700}
.meCard .linkbtn{border:none;background:none;color:var(--muted);text-decoration:underline;font-size:13px;padding:0}
.pick h2{font-size:18px;margin:18px 0 6px}
.pick .gl{margin:12px 0 4px;font-weight:700;display:flex;align-items:center;gap:6px}
.pick .names{display:flex;flex-wrap:wrap;gap:8px}
.pick .names button{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:10px 16px;font-size:16px;min-width:88px}
.pick .names button:hover{border-color:var(--ink)}
.pick .names button.done{background:var(--mist);color:var(--muted)}
.pfoot{margin-top:40px;text-align:center}
.pfoot .status{justify-content:center}
.pfoot button{border:none;background:none;color:var(--muted);font-size:13px;text-decoration:underline}
.bigbtn{background:var(--saffron);color:#fff;border:none;border-radius:10px;padding:10px 22px;font-size:16px;font-weight:700}

/* sw item with dimension */
.item{grid-template-columns:1fr 140px auto auto auto}
.item select{min-width:0;width:100%}
@media (max-width:760px){.item{grid-template-columns:1fr 1fr}.item textarea{grid-column:1/3}.item select{grid-column:1/3}}
.sumtitle{margin:22px 0 8px;font-size:16px;font-weight:700}
.mk{font-size:12px;color:var(--saffron);margin-left:4px;white-space:nowrap}
ul.cellist{margin:0;padding:8px 10px 8px 26px;font-size:14px}
ul.cellist li{margin:2px 0}

/* simple list (traits) */
.addrow{display:flex;gap:8px;margin:8px 0 12px;flex-wrap:wrap}
.addrow input{flex:1 1 220px;border:1px solid var(--line);border-radius:8px;background:var(--field);padding:8px 10px}
.tlist{display:flex;flex-wrap:wrap;gap:8px}
.tchip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:999px;padding:4px 6px 4px 12px;background:var(--paper);font-size:15px}
.tchip button{border:none;background:none;color:var(--muted);font-size:15px;padding:0 4px;line-height:1}
.gdots{display:inline-flex;gap:2px;margin-left:4px}
.gdots i{width:7px;height:7px;border-radius:50%;display:inline-block}

/* traits8 */
.t8{display:grid;gap:10px}
.t8row{border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;grid-template-columns:2em minmax(140px,220px) 1fr auto;gap:10px;align-items:center}
.t8row .no{font-family:var(--serif);font-weight:900;color:var(--saffron);font-size:18px}
.t8row input.tt{border:1px solid var(--line);border-radius:8px;background:var(--field);padding:6px 10px;font-weight:700;font-size:16px;width:100%}
.t8row .noms{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.t8row .nom{background:var(--saffron-soft);border-radius:999px;padding:2px 4px 2px 10px;font-size:14px;display:inline-flex;align-items:center;gap:2px}
.t8row .nom b{font-size:12px;color:var(--saffron);margin-left:2px}
.t8row .nom button{border:none;background:none;color:var(--muted);padding:0 4px}
.t8row .nomadd{display:flex;gap:4px}
.t8row .nomadd select{min-width:110px;padding:4px 6px}
.t8row .nomadd button{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:4px 10px;font-size:13px}
.t8row .ro{font-weight:700;font-size:17px}
@media (max-width:700px){.t8row{grid-template-columns:2em 1fr auto}.t8row .noms{grid-column:1/4}}
.refbox{border:1px dashed var(--line);border-radius:10px;padding:10px 12px;margin-bottom:14px}
.refbox .cap{font-size:13px;color:var(--muted);margin-bottom:6px}

/* SO/WT board */
.pool{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:12px;background:var(--mist)}
.pool .filters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;align-items:center}
.pool .filters button{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:3px 10px;font-size:13px;display:inline-flex;align-items:center;gap:5px}
.pool .filters button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.pool .tags{display:flex;flex-wrap:wrap;gap:6px;max-height:210px;overflow:auto;padding:2px}
.tag{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:4px 8px;font-size:13px;line-height:1.35;cursor:grab;text-align:left;max-width:100%}
.tag .cd{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.tag small{color:var(--muted);font-size:11px}
.tag.sel{outline:2px solid var(--saffron);background:var(--saffron-soft)}
.tag.used{opacity:.6}
.tag .star{border:none;background:none;padding:0 2px;font-size:14px;color:var(--muted);line-height:1}
.tag .star.on{color:var(--saffron)}
.tag .x{border:none;background:none;padding:0 2px;color:var(--muted);line-height:1}
.tag.star-on{border-color:var(--saffron);font-weight:700}
.pool .hintline{font-size:12px;color:var(--muted);margin-top:6px}
table.board td{min-width:130px;padding:6px;vertical-align:top}
table.board td .drop{min-height:56px;display:flex;flex-direction:column;gap:4px;border-radius:6px;padding:2px}
table.board td.hot .drop{background:var(--saffron-soft);outline:1px dashed var(--saffron)}
table.board td.armed{cursor:copy}
table.board td.armed:hover .drop{background:var(--saffron-soft)}
.board-legend{font-size:13px;color:var(--muted);margin:6px 0 10px}

/* slides extra */
.slide .qrbig{display:flex;gap:4vw;align-items:center;flex-wrap:wrap}
.slide .qrbig .code{background:#fff;padding:12px;border-radius:12px;line-height:0}
.slide .ckgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:1.5vw;font-size:clamp(13px,1.3vw,18px);margin-top:3vh}
.slide .ckgrid h3{margin:0 0 .6vh;font-size:1.15em}
.slide .ckgrid div div{padding:2px 0;color:#6D7E8F}
.slide .ckgrid div div.in{color:#F3F5F7}
.slide .ckgrid div div.in::before{content:"✓ ";color:#7FD1AE}
.slide .count{font-family:var(--serif);font-weight:900;font-size:clamp(48px,8vw,120px);color:#E9B43A;line-height:1}

function exportRows(){if(0)return;
  const rows=[["表格","組別","項目","欄位","內容"]];
  Object.entries(FORMS).forEach(([fid,f])=>groupsFor(fid).forEach(g=>{
    const id=docId(fid,g),b=Store.body(id),gn=GROUPS[g].name;
    if(f.type==="grid"){(f.topFields||[]).forEach(([k,l])=>b.cells[k]&&rows.push([f.title,gn,l,"",b.cells[k]]));
      gridRows(f).forEach((r,ri)=>f.cols.forEach((c,ci)=>{const v=b.cells["r"+ri+"c"+ci];if(v)rows.push([f.title,gn,(r.glabel?r.glabel+"／":"")+r.label,(f.editableCols&&f.editableCols.includes(ci)&&b.cells["col"+ci])||c,v])}))}
    else if(f.type==="sw")Store.items(id).sort(byT).forEach(([k,v])=>rows.push([f.title,gn,v.dim||"未分類",(v.side==="W"?"劣勢":"優勢")+(v.imp?"・"+v.imp:"")+(v.urg?"・"+v.urg:""),v.text]));
    else if(f.type==="compare3"){RIVAL_SLOTS.forEach(([sl,lab])=>{const nm=rivalName(g,sl);COMP10.forEach((d,i)=>{const r=b.cells[sl+".r"+i],v=b.cells[sl+".v"+i],n=b.cells[sl+".n"+i];if(r||v||n)rows.push([f.title,gn,lab+"："+nm+"／"+d,v?VERDICT[v][0]:"",(r||"")+(n?"｜比較："+n:"")])});if(b.cells[sl+".sum"])rows.push([f.title,gn,lab+"："+nm,"總結",b.cells[sl+".sum"]])})}
    else if(f.type==="rivals"){RIVAL_SLOTS.forEach(([sl,lab])=>{RIVAL_FIELDS.forEach(([k,l])=>{const v=b.cells[sl+"."+k];if(v)rows.push([f.title,gn,lab,l,v])});Store.items(id).filter(([k,v])=>v.slot===sl&&v.url).forEach(([k,v])=>rows.push([f.title,gn,lab,"附件",v.name+" "+v.url]))})}
    else if(["p1","p2","dproj","dkpi","dorg","dfb"].includes(f.type)){const b2=Store.body(id);Object.entries(b2.cells).forEach(([k,v])=>v&&rows.push([f.title,gInfo(g).name,k,"",v]));Object.values(b2.items).filter(Boolean).forEach(v=>rows.push([f.title,gInfo(g).name,"",JSON.stringify(v).slice(0,20),JSON.stringify(v)]))}
    else if(f.type==="traitsubmit"){[...mergedTraits().entries()].forEach(([t,n])=>rows.push([f.title,"全公司",t,"次數",String(n)]))}
    else if(f.type==="feedback"){fbAll().forEach(([k,v])=>FB_Q.forEach(q=>{const x=v[q.k];if(x!=null&&x!=="")rows.push([f.title,"",q.t,"",Array.isArray(x)?x.join("、"):String(x)])}))}
    else if(f.type==="list")Store.items(id).sort(byT).forEach(([k,v])=>rows.push([f.title,gn,"","",v.text]));
    else if(f.type==="traits8"){const all=Store.items(id);all.filter(([k,v])=>v.kind==="trait").sort(byT).forEach(([k,v])=>{const ns=all.filter(([nk,nv])=>nv.kind==="nom"&&nv.trait===k).map(([nk,nv])=>nv.name);rows.push([f.title,gn,v.text,"代表人物",ns.join("、")])})}
    else if(f.type==="board"){const rs=gridRows(f);Store.items(id).forEach(([k,v])=>{const mm=/^r(\d+)c(\d+)$/.exec(v.cell||"");if(!mm)return;const r=rs[+mm[1]];rows.push([f.title,gn,r.glabel+"／"+r.label,f.cols[+mm[2]],(v.star?"★ ":"")+v.text])})}
    else if(f.type==="roles"){rows.push([f.title,gn,"組長","",b.cells.leader||""]);ROLE_MEETINGS.forEach(([m,d])=>{rows.push([f.title,gn,d,"記錄人",b.cells["rec_"+m]||""]);rows.push([f.title,gn,d,"報告人",b.cells["rep_"+m]||""])})}
  }));
  MEETINGS.forEach(m=>meetingDates(m).forEach(d=>ALL_PEOPLE.forEach(([n])=>{const r=Att.rec(d,n);rows.push(["出缺席",md(d)+" "+m.no,n,attStatus(m,d,n),(r.checkin?"報到 "+isoHM(r.checkin):"")+(r.leave?" 請假 "+(r.reason||""):"")])})));
  return rows;
}
async function exportCSV(){
  const q=v=>'"'+String(v==null?"":v).replace(/"/g,'""')+'"';
  const csv="\ufeff"+exportRows().map(r=>r.map(q).join(",")).join("\n");const name="百鮮2026年度檢討_全部表格.csv";

  if(dl){try{await dl.save({filename:name,data:new Blob([csv],{type:"text/csv"})})}catch(e){toast("沒有下載檔案")}return}
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download=name;document.body.append(a);a.click();a.remove();
}
